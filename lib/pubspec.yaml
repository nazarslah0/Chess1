name: chess_analyzer
description: "Golden Chess - chess game analysis, puzzles and play with a real Stockfish 19 engine."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  chess: ^0.8.1
  audioplayers: ^6.1.0
  http: ^1.2.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_svg: ^2.0.17
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Chess pieces
    - assets/pieces/classic_svg/

    # شاشة «حلل مباراة»: الخلفية وأيقونات المصادر
    - assets/analyze/

    # Lichess puzzles (brilliant / checkmate) - built by tool/build_puzzles.py
    - assets/puzzles/

    # رقع SVG (متجهة)
    - assets/boards_svg/

    # صور الروبوتات (شاشة العب ضد روبوت)
    - assets/bots/

    # أصوات الشطرنج (WAV)
    - assets/sounds/
